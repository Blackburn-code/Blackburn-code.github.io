<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kek Kak Ika</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: one warm peach stage — headline, glowing cake you tap, a caption that talks back, then the birthday card */
:root{
  --peach:#fff1e8; --glow:#ffc2a8; --ink:#4a2c2a; --muted:#8a6159;
  --cream:#fff8ec; --sponge:#ff8fa3; --sponge-dark:#e5677f; --plate:#ffffff;
  --flame:#ffb703; --card:#ffffff; --accent:#ff5d73;
  --display:"Baloo 2","Trebuchet MS",sans-serif;
  --hand:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--peach);color:var(--ink);font-family:var(--hand);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.stage{max-width:520px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}

/* Kek */
.cakeBtn{position:relative;width:260px;max-width:100%;height:270px;border:0;background:none;cursor:pointer;padding:0;margin-top:6px}
.cakeBtn:focus-visible{outline:3px dashed var(--accent);outline-offset:6px;border-radius:20px}
.aura{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);animation:pulse 2.6s ease-in-out infinite}
.cake{position:absolute;inset:0;animation:beat 2.6s ease-in-out infinite;transform-origin:50% 80%}
.plate{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:250px;height:28px;border-radius:50%;background:var(--plate);box-shadow:0 8px 18px rgba(160,80,60,.18)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px;
  background:linear-gradient(var(--sponge),var(--sponge-dark))}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;border-radius:14px 14px 0 0;
  background:radial-gradient(circle at 12px 18px,var(--cream) 12px,transparent 13px) 0 0/24px 30px repeat-x,linear-gradient(var(--cream),var(--cream)) 0 0/100% 14px no-repeat}
.t1{bottom:32px;width:210px;height:86px}
.t2{bottom:114px;width:150px;height:66px}
.dots{position:absolute;left:0;right:0;bottom:16px;height:10px;background:radial-gradient(circle,var(--cream) 3px,transparent 4px) 0 0/20px 10px repeat-x}
.candles{position:absolute;bottom:178px;left:50%;transform:translateX(-50%);display:flex;gap:26px}
.candle{position:relative;width:10px;height:44px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff 0 6px,#7cc6fe 6px 12px)}
.flame{position:absolute;left:50%;bottom:46px;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fff 0 20%,var(--flame) 45%,#ff6b00 100%);box-shadow:0 0 16px 6px rgba(255,183,3,.55);
  transform-origin:50% 100%;animation:flicker .18s infinite alternate;transition:transform .25s,opacity .25s}
.out .flame{transform:scale(0);opacity:0}
.smoke{position:absolute;left:50%;bottom:48px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(120,110,110,.45);opacity:0}
.puff .smoke{animation:smoke 1.2s ease-out forwards}

.caption{font-size:1.35rem;min-height:3.2em;max-width:34ch;margin:0;line-height:1.3}
.tries{font-family:var(--display);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}

.card{width:100%;background:var(--card);border-radius:18px;padding:22px 20px;box-shadow:0 14px 34px rgba(160,80,60,.18);text-align:left;
  transform:translateY(20px) scale(.96);opacity:0;transition:.6s cubic-bezier(.2,1.3,.4,1)}
.card.show{transform:none;opacity:1}
.card h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0 0 8px;color:var(--accent)}
.card p{font-size:1.25rem;line-height:1.4;margin:0 0 10px;min-height:1.4em;white-space:pre-line}
.card .sign{text-align:right;color:var(--muted);margin:0}
.again{font-family:var(--display);font-weight:700;font-size:1rem;border:2px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:999px;padding:8px 18px;cursor:pointer}
.again:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.05)}30%{transform:scale(.98)}45%{transform:scale(1.03)}}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
@keyframes flicker{to{transform:rotate(4deg) scaleY(1.08)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(3)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

<main class="stage">
  <p class="eyebrow">Penghantaran khas dari geng opis</p>
  <h1>Ada kek untuk <span>Kak Ika</span></h1>

  <button class="cakeBtn" id="cakeBtn" type="button" aria-label="Tiup lilin">
    <div class="aura"></div>
    <div class="cake" id="cake">
      <div class="plate"></div>
      <div class="tier t1"><div class="dots"></div></div>
      <div class="tier t2"></div>
      <div class="candles" id="candles">
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      </div>
    </div>
  </button>

  <p class="caption" id="caption" aria-live="polite">Tekan kek untuk tiup lilin 🎂</p>
  <p class="tries" id="tries"></p>

  <section class="card" id="card" hidden>
    <h2>Selamat Hari Jadi, Kak Ika! 🎉</h2>
    <p id="msg"></p>
    <p class="sign" id="sign"></p>
  </section>
  <button class="again" id="again" type="button" hidden>Tiup sekali lagi</button>
</main>

<script>
/* ===== UBAH DI SINI ===== */
const NAMA = "Kak Ika";
const GURAUAN = [ // ayat bila lilin menyala balik
  "Eh? Menyala balik. Lilin ni degil macam printer opis.",
  "Tiup kuat sikit, Kak. Macam tiup kopi panas waktu rehat tu.",
  "Lilin ni minta kelulusan bos dulu agaknya. Cuba lagi!",
];
const BERJAYA = "Akhirnya! Lilin pun kena tunggu Kak Ika approve baru padam 😆";
const TAJUK = "Happy Birthday Kak Ika! 🥳🎂";
const UCAPAN =
`Semoga panjang umur, murah rezeki, sihat selalu dan happy selalu. Semoga semua urusan dipermudahkan.

Makin bertambah umur, makin awet muda tau, jangan makin kuat membebel sudah 😂❤️

Enjoy your day, Kak Ika! 🎉`;
const DARI = "— Geng opis";
/* ======================== */

const $=id=>document.getElementById(id);
const cakeBtn=$('cakeBtn'),candles=$('candles'),cake=$('cake'),cap=$('caption'),tries=$('tries'),card=$('card'),song=$('song'),again=$('again');
let n=0,busy=false,done=false;
document.querySelector('h1 span').textContent=NAMA;document.querySelector('.card h2').textContent=TAJUK;

function blowOut(){candles.classList.add('out');candles.classList.remove('puff');void candles.offsetWidth;candles.classList.add('puff')}
function relight(){candles.classList.remove('out','puff')}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

cakeBtn.onclick=async()=>{
  if(busy||done)return;busy=true;
  if(song.paused)song.play().catch(()=>{});
  blowOut();n++;tries.textContent=`Cubaan tiup: ${n}`;
  if(n<=GURAUAN.length){
    cap.textContent="Fuhhh... 💨";await wait(1100);
    relight();cake.classList.add('shake');setTimeout(()=>cake.classList.remove('shake'),400);
    cap.textContent=GURAUAN[n-1];busy=false;
  }else{
    done=true;cap.textContent=BERJAYA;burst();
    card.hidden=false;requestAnimationFrame(()=>card.classList.add('show'));
    await wait(500);card.scrollIntoView({behavior:'smooth',block:'center'});
    await type($('msg'),UCAPAN,32);await type($('sign'),DARI,45);
    again.hidden=false;busy=false;
  }
};
again.onclick=()=>{n=0;done=false;relight();card.classList.remove('show');card.hidden=true;again.hidden=true;
  $('msg').textContent='';$('sign').textContent='';tries.textContent='';cap.textContent="Tekan kek untuk tiup lilin 🎂";scrollTo({top:0,behavior:'smooth'})};

function type(el,txt,ms){return new Promise(r=>{let i=0;el.textContent='';const t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(t);r()}},ms)})}

// Confetti
const c=$('fx'),x=c.getContext('2d');let bits=[];
function size(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',size);size();
const COL=['#ff5d73','#ffb703','#7cc6fe','#8ce99a','#c084fc','#ff8fa3'];
function burst(){for(let i=0;i<180;i++)bits.push({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
  s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COL[i%COL.length],life:0});
  if(bits.length===180)loop()}
function loop(){x.clearRect(0,0,c.width,c.height);bits=bits.filter(b=>b.y<c.height+20&&b.life<400);
  for(const b of bits){b.vy+=.32;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life++;
    x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle=b.c;x.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);x.restore()}
  if(bits.length)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)}
</script>

</body>
</html>
