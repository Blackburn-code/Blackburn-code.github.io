<script>
const WORDS = ['TEST','test','Test','TEST','test'];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const au = document.getElementById('au');
let W, H, D, S;           // ukuran skrin, pixel ratio, skala hati
let started = false, t0 = 0;

// sprite perkataan bercahaya (dilukis sekali, kemudian disalin = laju)
const spriteCache = {};
function sprite(word, bold){
  const key = word + bold;
  if (spriteCache[key]) return spriteCache[key];
  const fs = 64, pad = 30;
  const m = document.createElement('canvas').getContext('2d');
  m.font = `${bold?800:600} ${fs}px "Segoe UI",Arial,sans-serif`;
  const w = Math.ceil(m.measureText(word).width) + pad*2, h = fs + pad*2;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.font = m.font; g.textBaseline = 'middle'; g.textAlign = 'center';
  g.shadowColor = 'rgba(255,40,20,1)'; g.shadowBlur = 26;
  g.fillStyle = '#ff2a1a'; g.fillText(word, w/2, h/2);
  g.shadowBlur = 8; g.fillStyle = '#ff6a4a'; g.fillText(word, w/2, h/2);
  g.shadowBlur = 0; g.fillStyle = '#ffb59a'; g.globalAlpha = .55; g.fillText(word, w/2, h/2);
  return spriteCache[key] = {c, w, h};
}

// titik-titik di dalam bentuk hati 3D
function inHeart(x, y){ // x,y dalam -1.3..1.3
  const a = x*x + y*y - 1; return a*a*a - x*x*y*y*y <= 0;
}
let P = [], BG = [], SPARK = [];
function build(){
  D = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W*D; cv.height = H*D; ctx.setTransform(D,0,0,D,0,0);
  S = Math.min(W*0.38, H*0.3);
  const n = Math.round(Math.min(480, 150 + W*H/2600));
  P = [];
  const outline = th => [16*Math.pow(Math.sin(th),3)/17, (13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th))/17];
  while (P.length < n){
    const th = Math.random()*Math.PI*2;
    const onEdge = Math.random() < .55;
    const r = onEdge ? 1 - Math.random()*0.08 : Math.sqrt(Math.random())*0.9;
    const [ox, oy] = outline(th);
    const x = ox*r*1.15, y = oy*r*1.15 + 0.1;
    const z = (Math.random()*2-1) * 0.35 * Math.sqrt(1 - r*r*0.9);
    const big = Math.random() < (onEdge ? .3 : .15);
    P.push({x, y:-y, z, edge:onEdge, w: WORDS[Math.random()*WORDS.length|0], size: big ? 9+Math.random()*5 : 5+Math.random()*4,
      bold: big, sx:(Math.random()-.5)*W*1.6, sy:(Math.random()-.5)*H*1.6, delay: Math.random()*1.6, fl: Math.random()*6.28});
  }
  BG = Array.from({length: Math.round(W*H/9000)}, () => ({x:Math.random()*W, y:Math.random()*H, v:.12+Math.random()*.3,
    w: WORDS[Math.random()*WORDS.length|0], size: 6+Math.random()*6, a: .08+Math.random()*.18}));
  SPARK = Array.from({length: Math.round(W*H/14000)}, () => ({x:Math.random()*W, y:Math.random()*H, v:.2+Math.random()*.5, s:2+Math.random()*3, p:Math.random()*6.28}));
}
addEventListener('resize', build); build();

function tinyHeart(x, y, s, a){
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ff3b2f'; ctx.translate(x, y); ctx.scale(s/10, s/10);
  ctx.beginPath(); ctx.moveTo(0,3); ctx.bezierCurveTo(0,0,-5,-2,-5,2); ctx.bezierCurveTo(-5,5,0,8,0,10);
  ctx.bezierCurveTo(0,8,5,5,5,2); ctx.bezierCurveTo(5,-2,0,0,0,3); ctx.fill(); ctx.restore();
}
const ease = k => 1 - Math.pow(1-k, 3);

function frame(now){
  const t = started ? (now - t0)/1000 : 0;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#050203'; ctx.fillRect(0, 0, W, H);

  // latar: perkataan pudar & hati kecil
  ctx.globalCompositeOperation = 'lighter';
  for (const b of BG){
    b.y -= b.v; if (b.y < -20){ b.y = H + 20; b.x = Math.random()*W; }
    const s = sprite(b.w, false), k = b.size/64;
    ctx.globalAlpha = b.a; ctx.drawImage(s.c, b.x - s.w*k/2, b.y - s.h*k/2, s.w*k, s.h*k);
  }
  for (const h of SPARK){
    h.y -= h.v; h.p += .02; if (h.y < -10){ h.y = H + 10; h.x = Math.random()*W; }
    tinyHeart(h.x + Math.sin(h.p)*8, h.y, h.s, .35 + .3*Math.sin(h.p*2));
  }

  if (started){
    // degupan jantung + putaran perlahan
    const beat = 1 + 0.06*Math.pow(Math.max(0, Math.sin(t*Math.PI*1.4)), 12) + 0.035*Math.pow(Math.max(0, Math.sin(t*Math.PI*1.4 - .6)), 12);
    const rot = Math.sin(t*0.45) * 0.35;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const cx = W/2, cy = H/2 + S*0.05;
    const pts = P.map(p => {
      const x = p.x*cr + p.z*sr, z = -p.x*sr + p.z*cr;
      const persp = 1.6/(1.6 - z*0.6);
      return {p, X: cx + x*S*beat*persp, Y: cy + p.y*S*beat*persp, z, persp};
    }).sort((a,b) => a.z - b.z);
    ctx.globalCompositeOperation = 'source-over';
    for (const q of pts){
      const p = q.p;
      const k = ease(Math.min(1, Math.max(0, (t - p.delay)/2.2)));   // perkataan terbang masuk membentuk hati
      const X = p.sx + W/2 + (q.X - p.sx - W/2)*k, Y = p.sy + H/2 + (q.Y - p.sy - H/2)*k;
      const s = sprite(p.w, p.bold), sc = p.size*q.persp/64;
      ctx.globalAlpha = Math.min(1, k*1.3) * (p.edge ? 0.85 : 0.35 + 0.3*((q.z+0.6)/1.2)) * (0.8 + 0.2*Math.sin(t*3 + p.fl));
      ctx.drawImage(s.c, X - s.w*sc/2, Y - s.h*sc/2, s.w*sc, s.h*sc);
    }
    // cahaya lembut di tengah
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S*1.4);
    g.addColorStop(0, 'rgba(255,40,20,.10)'); g.addColorStop(1, 'rgba(255,40,20,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

async function go(){
  if (started) return;
  started = true; t0 = performance.now();
  document.getElementById('start').classList.add('out');
  try { await document.documentElement.requestFullscreen?.({navigationUI:'hide'}); } catch(e){}
  try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}
  au.currentTime = 0; au.play().catch(()=>{});
}
document.getElementById('start').addEventListener('click', go);
document.getElementById('start').addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') go(); });
// lagu habis: tekan skrin untuk main semula
au.addEventListener('ended', () => { cv.onclick = () => { au.currentTime = 0; au.play().catch(()=>{}); }; });
</script>
